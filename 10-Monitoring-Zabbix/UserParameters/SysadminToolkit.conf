# Sysadmin-Toolkit :: Zabbix Agent UserParameter
# ------------------------------------------------------------------------------
# One item, "toolkit.metrics", returns a single-line JSON snapshot of this
# machine's health (see Get-ToolkitZabbixMetrics.ps1 in this same folder).
# The Zabbix template (..\zbx_template_windows_sysadmintoolkit.xml) reads this
# ONE item with dependent items + JSONPath preprocessing, so one PowerShell
# launch per poll feeds every metric instead of one launch per item.
#
# Install (Zabbix Agent 2, Windows):
#   1. Copy this file to the agent's include directory, e.g.:
#        C:\Program Files\Zabbix Agent 2\zabbix_agent2.d\SysadminToolkit.conf
#   2. Copy Get-ToolkitZabbixMetrics.ps1 to the path referenced below (or edit
#      the path here to match where you put it).
#   3. Confirm zabbix_agent2.conf has:  Include=zabbix_agent2.d\*.conf
#   4. Restart the Zabbix Agent 2 service.
#   5. Test from the agent itself:  zabbix_agent2.exe -t toolkit.metrics
#
# Install-ZabbixAgent.ps1 in the parent folder does steps 1-2 and 4 for you
# when run with -DeployUserParameters.
# ------------------------------------------------------------------------------

UserParameter=toolkit.metrics,powershell.exe -NoProfile -NonInteractive -ExecutionPolicy Bypass -File "C:\Sysadmin-Toolkit\10-Monitoring-Zabbix\UserParameters\Get-ToolkitZabbixMetrics.ps1"
